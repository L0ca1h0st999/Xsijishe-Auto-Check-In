name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 设置 Python 环境
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装测试依赖
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: 运行单元测试
        run: pytest -v
